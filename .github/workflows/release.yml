name: Release

# Tag v* → build VSIX + GitHub Release (attach .vsix)
# Manual: Actions → Release → Run workflow
#
# Local one-shot:
#   npm run ship          # patch bump
#   npm run ship -- minor
#   npm run ship -- 0.6.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with VSIX'
        required: true
        default: true
        type: boolean

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - run: npx @vscode/vsce package --no-dependencies --allow-star-activation
      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          name: 'Claude Accounts + Usage ${{ github.ref_name }}'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          tag_name: ${{ steps.package_version.outputs.tag }}
          name: 'Claude Accounts + Usage ${{ steps.package_version.outputs.tag }}'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
